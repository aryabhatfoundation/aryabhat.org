<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#11202f">
  <title>404 — Lost in Orbit · Aryabhat</title>
  <!-- Deliberately standalone: no style.css, no analytics.js, no webmanifest,
       no favicon set, no Google Fonts. The previous version pulled all of them
       plus 14 KB of inline CSS, for 21,949 bytes a request. Cloud Logging shows
       scanners hitting this page ~2,000 times a day probing for WordPress and
       PHP — they never render a page, they just read the body. It now costs one
       request and about a tenth of the bytes. Keep it that way.
       Colours mirror css/style.css; wording is unchanged. -->
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%23ffcc33' stroke-width='3'/%3E%3C/svg%3E">
  <style>
    :root { color-scheme: dark }
    body {
      margin: 0; min-height: 100vh; box-sizing: border-box; display: grid; place-items: center;
      background: #11202f; color: #e8eef6; text-align: center; padding: 24px;
      font: 400 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .code { font-size: 3.2rem; font-weight: 700; color: #ffcc33; line-height: 1; margin: 0 }
    h1 { margin: 6px 0 10px; font-size: 1.35rem; font-weight: 600 }
    p { margin: 0 auto 28px; max-width: 30rem; color: #a8b8cc }
    nav a {
      display: inline-block; margin: 4px 6px; padding: 10px 22px; border-radius: 999px;
      border: 1px solid #243348; color: #e8eef6; text-decoration: none;
    }
    nav a:hover { border-color: #ffcc33; color: #ffcc33 }
    footer { margin-top: 32px; font-size: .8rem; color: #5f7189 }
  </style>
</head>

<body>
  <main>
    <p class="code">404</p>
    <h1>Lost in orbit</h1>
    <p>This page drifted out of view. The address you followed isn't anywhere in our
      universe — the link may have moved, or the page may have never existed.
      Let's get you back to a known sky.</p>
    <nav>
      <a href="/">← Take me home</a>
      <a href="/sky/">Open Sky Map</a>
      <a href="/quiz/">Astronomy Quiz</a>
    </nav>
  </main>
</body>

</html>
