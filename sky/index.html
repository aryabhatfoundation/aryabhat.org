<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Google Analytics 4 (centralized in /js/analytics.js) -->
    <script src="/js/analytics.js"></script>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sky: Aryabhat</title>
    <meta name="description"
        content="Tools for a night under the stars from any city or dark-sky site in India: what is up this evening, an evening planner with a Moon calendar, a chart of the whole sky, all 88 constellations and the brightest stars.">
    <meta name="author" content="Alok Mandavgane, Aryabhat Foundation">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
    <!-- The Sky section installs as an app of its own: sky.webmanifest
         names it, gives it the hub as its front door and the section as
         its scope. The colour is the one behind every page here. -->
    <meta name="theme-color" content="#0b1a26">
    <link rel="manifest" href="sky.webmanifest">
    <link rel="stylesheet" type="text/css" href="/css/style.css" media="screen" />
    <!-- Tokens, the shell, buttons, the night's numbers and the atlas furniture: css/sky.css -->
    <link rel="stylesheet" type="text/css" href="css/sky.css?v=20260905b" media="screen" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- SunCalc: tonight's sunset, full dark and Moon, for the strip -->
    <script src="js/vendor/suncalc.min.js"></script>

    <!-- The place and the night the whole section works from. -->
    <script src="js/sky-places.js"></script>
    <script src="js/sky-night.js?v=20260905b"></script>
    <!-- The section's registry and shell. /js/layout.js draws nothing on
         these pages (there is no site header here) but exports the list of
         the site's sections that the shell's menu shows. -->
    <script src="/js/layout.js?v=20260905b"></script>
    <script src="js/sky-nav.js?v=20260905b"></script>
    <!-- The shape of the evening: sunset, full dark, the Moon, dark hours. -->
    <script src="js/sky-evening.js?v=20260905b"></script>

    <style>
        /* ==========================================================
           index.html — the hub: only what is peculiar to it, which
           is the tonight strip and the tiles. Tokens, the shell, the
           night's four numbers and the list heads are in css/sky.css.
           ========================================================== */

        body {
            background: none;
        }

        .atlas-head .atlas-lede {
            margin-bottom: 1rem;
        }

        /* ------------------------------------------------------------
           TONIGHT — the night at a glance, from js/sky-evening.js. The
           one thing on the hub that is not a link: what you would open
           the planner to find out first.
           ------------------------------------------------------------ */
        .tonight {
            margin: 0 0 .4rem;
        }

        .tonight .list-head {
            margin-top: .6rem;
        }

        .list-head b {
            color: var(--gold);
            font-weight: 600;
        }

        .tonight-moon {
            margin: -6px 0 0;
            text-align: center;
            color: var(--ink-dim);
            font-size: .85rem;
        }

        .tonight-moon b {
            color: var(--ink);
            font-weight: 600;
        }

        /* ------------------------------------------------------------
           TILES — the tools, in two groups, from the registry.
           ------------------------------------------------------------ */
        .portal-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 14px;
            margin: 0 0 1rem;
        }

        .portal-card {
            display: flex;
            flex-direction: column;
            gap: 7px;
            padding: 20px 20px 18px;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: linear-gradient(160deg, rgba(30, 45, 66, 0.9), rgba(15, 26, 38, 0.92));
            text-decoration: none;
            color: inherit;
            transition: border-color .2s ease, box-shadow .25s ease, transform .15s ease;
        }

        .portal-card:hover,
        .portal-card:focus {
            border-color: rgba(255, 204, 51, 0.5);
            box-shadow: 0 0 26px rgba(255, 204, 51, 0.12);
            transform: translateY(-2px);
            outline: 0;
        }

        .portal-icon {
            font-size: 1.8rem;
            line-height: 1;
        }

        .portal-title {
            font-family: var(--font-display);
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: var(--ink);
        }

        .portal-text {
            flex: 1 1 auto;
            color: var(--ink-dim);
            font-size: 0.9rem;
            line-height: 1.55;
        }

        .portal-go {
            font-family: var(--font-display);
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: .03em;
            color: var(--gold);
            margin-top: 3px;
        }

        .portal-card:hover .portal-go {
            color: var(--gold-soft);
        }

        @media (max-width: 600px) {
            .portal-grid {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .portal-card {
                padding: 16px;
                gap: 5px;
            }

            .portal-icon {
                font-size: 1.5rem;
            }

            .portal-title {
                font-size: 1.1rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header class="sky-shell">
            <!-- The section's shell — mark, name, tools, site menu — and the
                 night bar under it: injected by js/sky-nav.js -->
        </header>

        <div class="main">
            <div class="atlas-head">
                <h1>The sky, <em>night by night</em></h1>
                <p class="atlas-lede">Tools for people who actually go out and look. Everything here works on a
                    phone, in the dark, with cold hands, and runs off the place and the night at the top.</p>
            </div>

            <section class="tonight" aria-labelledby="tonight-head">
                <h2 class="list-head" id="tonight-head">Tonight from <b id="tonight-place">here</b></h2>
                <div class="night-times" id="night-times"></div>
                <p class="tonight-moon" id="tonight-moon"></p>
            </section>

            <!-- Built from js/sky-nav.js, so the section is described in
                 exactly one place. -->
            <h2 class="list-head">Look up</h2>
            <div class="portal-grid" id="grid-tonight"></div>

            <h2 class="list-head">Learn the sky</h2>
            <div class="portal-grid" id="grid-learn"></div>
        </div>

        <p class="footer-line">&copy; Aryabhat Foundation &middot;</p>
    </div>

    <script>
        (function () {
            'use strict';

            // ── Tonight at a glance ──
            function nightLabel() {
                if (SkyNight.isTonight()) return 'Tonight';
                var d = SkyNight.date, t = new Date();
                var tomorrow = new Date(t.getFullYear(), t.getMonth(), t.getDate() + 1, 12);
                if (d.getFullYear() === tomorrow.getFullYear() && d.getMonth() === tomorrow.getMonth() &&
                    d.getDate() === tomorrow.getDate()) return 'Tomorrow';
                var opts = { weekday: 'short', day: 'numeric', month: 'short' };
                if (d.getFullYear() !== t.getFullYear()) opts.year = 'numeric';
                return d.toLocaleDateString('en-IN', opts);
            }

            function renderTonight() {
                var evening = SkyEvening.of(SkyNight.place, SkyNight.date);
                var head = document.getElementById('tonight-head');
                head.textContent = '';
                head.appendChild(document.createTextNode(nightLabel() + ' from '));
                var b = document.createElement('b');
                b.id = 'tonight-place';
                b.textContent = SkyPlaces.label(SkyNight.place);
                head.appendChild(b);

                SkyEvening.renderCells(document.getElementById('night-times'), evening);

                var moon = document.getElementById('tonight-moon');
                moon.textContent = '';
                moon.appendChild(document.createTextNode(SkyEvening.moonIcon(evening.phase) + ' '));
                var name = document.createElement('b');
                name.textContent = SkyEvening.moonPhaseName(evening.phase);
                moon.appendChild(name);
                moon.appendChild(document.createTextNode(
                    ' · ' + Math.round(evening.fraction * 100) + '% lit'));
            }

            SkyNight.on(renderTonight);
            renderTonight();

            // ── The tiles ──
            // A tile for a page that works from a place and a night opens on
            // the ones this page is showing; a tile for an atlas page stays
            // plain. js/sky-nav.js re-points them when either moves.
            function tile(page) {
                var card = document.createElement('a');
                card.className = 'portal-card';
                card.href = SkySection.decorate(page.href);
                [['portal-icon', page.icon], ['portal-title', page.title],
                 ['portal-text', page.blurb], ['portal-go', page.cta]
                ].forEach(function (part) {
                    var span = document.createElement('span');
                    span.className = part[0];
                    span.textContent = part[1];
                    card.appendChild(span);
                });
                return card;
            }

            [['tonight', 'grid-tonight'], ['learn', 'grid-learn']].forEach(function (g) {
                var grid = document.getElementById(g[1]);
                SkySection.group(g[0]).forEach(function (page) { grid.appendChild(tile(page)); });
            });
        })();
    </script>
    <!-- Background Animation — page-scoped replacement for js/background-stars.js -->
    <script src="/js/cosmos-bg.js"></script>
</body>

</html>
